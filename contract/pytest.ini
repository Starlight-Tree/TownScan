[pytest]
# このディレクトリで流す（rootdir = contract/）。キャッシュは書かない（読み取り専用でマウントされるため）
pythonpath = .
testpaths = .
addopts = -p no:cacheprovider
markers =
    variant(*names): この検査が対象にする API の構成（既定は main）。CONTRACT_VARIANT と合わないものは外す（README の「API の構成」）
    history: 会話の履歴の検査（機能の印。構成の印 variant とは別）。CONTRACT_FEATURES に history が無いとき（履歴を持たない API）は、構成が合っていても外す
