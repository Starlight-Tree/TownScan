# TownScan のローカル実行（Postgres 17 + Go の API + Next.js）。仕様: docs/spec-prototype.md §2。API は Go（ADR 0005）
#   scripts/dev-up.sh                # 起動（.env の作成・frontend のビルド・up・healthy 待ち・実データの読み込みまで）
#   http://127.0.0.1:3500            # 画面（web）
#   http://127.0.0.1:8500/api/health # API（Go。仕様のページは無い。契約は docs/spec-prototype.md §4.4 と contract/）
# データの読み込み（pipeline の出力 → DB）は Python の仕事: docker compose run --rm loader python -m pipeline.load --run /data/townscan/run1/out
# ポートは 127.0.0.1 だけに公開する。他のローカルのサービス（JobNavi 3200/8200、ShopOrder 3400/8400、DocuNavi 5433）と重ねない。変えない。
# db は公開しない。Docker VM の空きが少ない（約 0.5 GB）ため、mem_limit を付けてある（db 256m・api 1g・web 512m）。api の 1g は、Go の JSON の読み込みが本文の大きさの数十倍のメモリーを使うため（本文の上限は 4 MiB。api/README.md）。
# ログイン（任意。Better Auth・Google だけ）: web が画面のサーバーの中で動かし、api は web の JWKS で JWT を検証するだけ。仕様: docs/spec-prototype.md §2.1
#   BETTER_AUTH_SECRET は scripts/dev-up.sh が .env に 1 回だけ作る。GOOGLE_CLIENT_ID・GOOGLE_CLIENT_SECRET は、あなたが .env に書く（無くても起動でき、ログイン以外は使える）。
name: townscan

services:
  db:
    image: postgres:17
    container_name: townscan-db
    labels:
      local.ui.group: "App-TownScan"
    mem_limit: 256m
    environment:
      POSTGRES_DB: townscan
      POSTGRES_USER: townscan
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD が未設定です。scripts/dev-up.sh を実行して .env を作ってください}"
    # 小さいデータなので、共有メモリーを絞る（mem_limit の中に収めるため）
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    volumes:
      - townscan-pgdata:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      # -h 127.0.0.1: 初回の初期化中の一時サーバー（ソケットだけ待ち受ける）を、起動済みと見なさないため
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U townscan -d townscan"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    # Go の API（api/Dockerfile。標準ライブラリと pgx などだけの静的なバイナリを distroless に置く）
    build:
      context: ./api
    container_name: townscan-api
    labels:
      local.ui.group: "App-TownScan"
    mem_limit: 1g
    environment:
      # mem_limit（1g）の内側で、Go の GC が先に働くようにする（超えると OOM で落ちるため）
      GOMEMLIMIT: "800MiB"
      # パスワードは英数字だけ（scripts/dev-up.sh が作る 16 進の乱数）。URL にそのまま入れる（web も同じ値を使う）
      DATABASE_URL: &database_url "postgresql://townscan:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD が未設定です}@db:5432/townscan"
      TILES_DIR: /data/townscan/tiles
      # 返答のモデル: gemini（この compose の既定。ユーザー決定 2026-11-25）か mock。gemini のときは GEMINI_API_KEY が要る（空なら起動時にエラー。黙って mock に落とさない）。
      # mock にするのは、Claude Code が内部で検証するときだけ（利用者は使わない）: LLM_PROVIDER=mock scripts/dev-up.sh（終わったら、付けずにもう一度流して戻す）。Go の API 自体の既定（環境変数が無いとき）は mock のまま。契約の検査・テストは mock を明示する
      # GEMINI_API_KEY は .env に自分で書く（値はここにも .env.example にも書かない。compose がホストの .env から渡す）。GEMINI_MODEL は空なら既定のモデル
      LLM_PROVIDER: "${LLM_PROVIDER:-gemini}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-}"
      # ログイン（任意）。画面のサーバー（web の Better Auth）が出す JWT を、その JWKS の公開鍵で検証するだけ（ログインの通信・秘密は持たない）。
      # AUTH_ISSUER は web の BETTER_AUTH_URL と同じ値（JWT の iss）、AUTH_AUDIENCE は web の JWT_AUDIENCE と同じ値（JWT の aud）。
      # AUTH_JWKS_URL は api のコンテナから届く web の URL（iss とは別。frontend-net 越し）。JWKS は呼ばれたときに取りに行く（web の起動を待たない）
      AUTH_ISSUER: "${BETTER_AUTH_URL:-http://localhost:3500}"
      AUTH_AUDIENCE: "${JWT_AUDIENCE:-townscan}"
      AUTH_JWKS_URL: "http://web:3000/api/auth/jwks"
    volumes:
      # 写真タイルと pipeline の出力（読み取り専用）。無いと Docker が root 所有で作るので、scripts/dev-up.sh が先に作る
      - ./data/townscan:/data/townscan:ro
    ports:
      - "127.0.0.1:8500:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net
    healthcheck:
      # distroless には curl も Python も無い。バイナリが、自分の /api/health を叩く（200 でなければ unhealthy）
      test: ["CMD", "/api", "-healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # データの読み込み（pipeline の出力 → DB）。Python の仕事（ADR 0005）。常駐しない（profiles: tools）。
  # 使い方: docker compose run --rm loader python -m pipeline.load --run /data/townscan/run1/out [--check]
  loader:
    build:
      context: ./pipeline
      dockerfile: loader.Dockerfile
      target: runtime
    profiles: ["tools"]
    labels:
      local.ui.group: "App-TownScan"
    mem_limit: 512m
    environment:
      DATABASE_URL: *database_url
    volumes:
      - ./data/townscan:/data/townscan:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net

  web:
    build:
      context: ./frontend
      # prebuilt: ホストで作った .next/standalone を載せるだけ（Docker VM のメモリーが少ないのでこちらが既定）
      # runtime : イメージの中で npm ci と next build まで行う（メモリーに余裕のある環境・CI 用）
      target: "${WEB_TARGET:-prebuilt}"
    container_name: townscan-web
    labels:
      local.ui.group: "App-TownScan"
    # 512m のまま。参照元の jobnavi-frontend（約 1.9 GB の実測）は next dev で、ここは standalone の本番実行。Better Auth と pg の接続プールで増えるのは数十 MB の見込み（未実測。dev-up のあとに docker stats で確かめる）
    mem_limit: 512m
    environment:
      # /api/* の転送先（実行時に読む）
      API_URL: "http://api:8000"
      # コンテナの HOSTNAME（コンテナ ID）のままだと、127.0.0.1 で待ち受けない
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
      # ログイン（Better Auth。Google だけ）。画面のサーバーの中で動く。値は .env（Git 管理外）から読み、このファイルには書かない。
      # BETTER_AUTH_URL は、ブラウザーから見た web の URL（Google のリダイレクト URI と JWT の iss になる。ポートを変えたら Google 側も直す）。
      # BETTER_AUTH_SECRET は 32 文字以上の乱数（scripts/dev-up.sh が作る）。一度決めたら変えない（DB の auth_jwks の署名鍵と Google のトークンの暗号化に使う。変えると全員がログアウトに見える）。
      # どれかが足りないときは、ログインが「まだ設定されていません」と出る（/api/auth/* は 503。ほかの画面と API は今まどおり動く）。だから、空の既定値で compose は起動できる。
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-http://localhost:3500}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      # JWT の対象（aud）。api の AUTH_AUDIENCE と同じ値になる
      JWT_AUDIENCE: "${JWT_AUDIENCE:-townscan}"
      # ログインの表（auth_ で始まる表）を読み書きするための DB 接続。注意: api と同じ資格情報で、表ごとの権限分けはしていない（auth_ の表だけを使うのは、コードの上の約束）。
      # 地区・候補などのアプリのデータは、これまでどおり api 経由で読む。web に届く経路は backend-net（internal）だけで、db は公開しない
      DATABASE_URL: *database_url
    ports:
      - "127.0.0.1:3500:3000"
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

networks:
  # web と api（web は Google への通信で外へ出る）。api は web の JWKS をここ越しに取りに行く
  frontend-net: {}
  # db と、api・web をつなぐ。外へは出られない（web が入っているのは、ログインの auth_ の表を読み書きするため）
  backend-net:
    internal: true

volumes:
  townscan-pgdata: {}
